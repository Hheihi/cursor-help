name: 🤖 AI Code Review

on:
  pull_request:
    branches: [ main, master, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  ai-code-review:
    name: AI代码审查
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 获取完整历史以便比较差异
        
    - name: 📦 设置 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: 🔧 设置 pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 8
        
    - name: 🔧 安装依赖
      run: pnpm install
      
    - name: 🤖 执行AI代码审查
      run: |
        chmod +x ai-code-review.js
        node ai-code-review.js origin/${{ github.base_ref }}
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
    - uses: pnpm/action-setup@v4
      with:
        version: 8
    - run: pnpm install
    - run: pnpm run lint 